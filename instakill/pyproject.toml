[project]
name = "instakill"
version = "0.5.0"
description = "InstaKill mini social network and feed evaluation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "pydantic>=2.7",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
semantic = ["sentence-transformers>=3.0"]
eval = ["pandas>=2.0", "matplotlib>=3.8"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
